# The config key table: one row per option, the single source both halves
# generate from. It replaces five overlapping lists in ocp_vscode/config.py
# (ui, workspace, control, keys, set) and viewer.html's toCamelCase, whose
# failure mode is silence - a key whose JS name is not the mechanical
# transform is ignored by the renderer and nothing says so.
#
# Columns needing human judgement are marked "# REVIEW". Bootstrapped from
# ocp_vscode 4.0.2: package.json contributes (group, type, default,
# persistent lifetime), standalone_defaults.py, and the five lists.

[[key]]
python = "ambient_intensity"
js = "ambientIntensity"
group = "RenderOptions"
role = "option"
lifetime = "persistent"
type = "number"
ts_type = "number"
default = 1
kind = "state"
reportable = true
lists = ["ui", "workspace", "keys", "set"]

