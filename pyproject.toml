[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocp-viewer-core"
version = "1.0.1"
authors = [{ name = "Bernhard Walter", email = "b_walter@arcor.de" }]
description = "Shared viewer core for ocp_vscode, ocp_viewer, Jupyter CadQuery and build123d Studio"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "3d models",
    "3d viewing",
    "3d",
    "brep",
    "cad",
    "cadquery",
    "opencascade",
    "python",
]
license = "Apache-2.0"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

# No OCP provider is declared, deliberately: the same OCP namespace is shipped
# by cadquery_ocp, cadquery_ocp_novtk and conda's OCP, and naming one would
# break the users of the other two. The host or the user chooses.
# threejs-materials is a show-path dependency, not an optional one: `_tessellate`
# tests `isinstance(node.material, PbrProperties)` to tell a threejs material from
# a build123d one, and an isinstance needs the class. The bound is ocp_vscode's,
# unchanged (vscode-ocp-cad-viewer/pyproject.toml:42), so nothing has to be
# re-resolved when the host adopts the core.
# pillow is the animation module's: `save_as_gif` assembles the frames. Shared
# functionality carries its dependency in the core rather than per host.
dependencies = ["ocp-tessellate>=3.5.0,<3.6.0", "orjson", "pillow", "threejs-materials>=1.2.0,<1.3.0"]

[project.optional-dependencies]
dev = ["build", "bump-my-version", "black", "pytest", "twine"]

[project.urls]
"Homepage" = "https://github.com/bernhard-42/ocp-viewer-core"
"Bug Tracker" = "https://github.com/bernhard-42/ocp-viewer-core/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ocp_viewer_core*"]

# ruff and ty are the whole toolchain: `ruff check` lints, `ty check` types, and
# nothing reformats. A formatter was dropped deliberately - black rewrapped a
# line onto two and carried the trailing `# noqa` onto the wrong one, where it
# suppressed nothing, so the linter and the formatter undid each other.

[tool.ruff]
target-version = "py310"
line-length = 88

# Version bumping lives in .bumpversion-py.toml and .bumpversion-js.toml, one
# per half: major.minor is the shared contract, the patch level is each half's
# own. See Development.md.
